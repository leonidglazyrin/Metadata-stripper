<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strip</title>
<style>
  :root {
    --bg: #fafaf9; --card: #ffffff; --ink: #18181b; --soft: #71717a; --faint: #a1a1aa;
    --line: #ececea; --accent: #18181b; --accent-ink: #fafaf9; --ok: #16a34a; --bad: #dc2626;
    --hover: #f4f4f3; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d; --card: #151517; --ink: #f4f4f5; --soft: #a1a1aa; --faint: #63636b;
      --line: #232326; --accent: #f4f4f5; --accent-ink: #0c0c0d; --ok: #4ade80; --bad: #f87171;
      --hover: #1c1c1f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    padding: 12vh 16px 48px;
  }
  main { width: 100%; max-width: 520px; }

  header { text-align: center; margin-bottom: 36px; }
  h1 { font-size: 30px; font-weight: 650; letter-spacing: -0.025em; }
  header p { color: var(--soft); margin-top: 6px; }

  #drop {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 44px 24px; border-radius: 20px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
  }
  #drop:hover { background: var(--hover); }
  #drop.over { transform: scale(1.015); border-color: var(--ink); }
  #drop:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .plus {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
  }
  #drop strong { font-weight: 550; }
  #drop small { color: var(--faint); font-size: 13px; margin-top: -10px; }

  #list { list-style: none; padding: 0; margin-top: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 10px 10px 10px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
    animation: in .25s ease both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .thumb {
    width: 44px; height: 44px; border-radius: 10px; flex: none; overflow: hidden;
    background: var(--hover); display: grid; place-items: center; color: var(--faint);
  }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 550; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub b { color: var(--ok); font-weight: 550; }
  .sub.err { color: var(--bad); }
  .track { height: 3px; border-radius: 3px; background: var(--line); margin-top: 7px; overflow: hidden; }
  .track > i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  .track.busy > i { width: 35% !important; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

  .btn {
    flex: none; border: 0; cursor: pointer; text-decoration: none;
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }

  #all {
    display: none; margin: 16px auto 0; padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 550; cursor: pointer;
  }
  #all:hover { background: var(--hover); }

  footer { margin-top: auto; padding-top: 56px; color: var(--faint); font-size: 12.5px; text-align: center; max-width: 420px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Strip</h1>
    <p>Remove every trace of metadata from your photos &amp; videos.</p>
  </header>

  <label id="drop" tabindex="0">
    <input id="input" type="file" multiple accept="image/*,video/*,.heic,.heif,.mkv,.mts,.m2ts" hidden>
    <span class="plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <strong>Drop files or click to upload</strong>
    <small>Photos and videos · EXIF, GPS, XMP, C2PA and more</small>
  </label>

  <ul id="list"></ul>
  <button id="all" type="button">Download all</button>
</main>

<footer>Files are processed and deleted immediately. Nothing is stored.</footer>

<script>
const $ = (s) => document.querySelector(s);
const drop = $('#drop'), input = $('#input'), list = $('#list'), allBtn = $('#all');
const done = [];

const ICON_DL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg>';
const ICON_FILE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';

drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => add(e.dataTransfer.files));
input.addEventListener('change', () => { add(input.files); input.value = ''; });
allBtn.addEventListener('click', () => done.forEach((a, i) => setTimeout(() => a.click(), i * 250)));

const queue = []; let running = 0;
function add(files) { for (const f of files) queue.push(row(f)); next(); }
function next() { while (running < 2 && queue.length) { running++; send(queue.shift()).finally(() => { running--; next(); }); } }

const size = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function row(file) {
  const li = h('li', 'item');
  const thumb = h('div', 'thumb', ICON_FILE);
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('image/')) {
    const img = new Image(); img.onload = () => thumb.replaceChildren(img); img.src = url;
  } else if (file.type.startsWith('video/')) {
    const v = document.createElement('video'); v.muted = true; v.preload = 'metadata';
    v.onloadeddata = () => thumb.replaceChildren(v); v.src = url + '#t=0.1';
  }
  const meta = h('div', 'meta');
  const name = h('div', 'name'); name.textContent = file.name;
  const sub = h('div', 'sub'); sub.textContent = 'Waiting…';
  const track = h('div', 'track', '<i></i>');
  meta.append(name, sub, track);
  li.append(thumb, meta);
  list.prepend(li);
  return { file, li, sub, track, bar: track.firstChild };
}

function send(r) {
  return new Promise((resolve) => {
    const fd = new FormData(); fd.append('file', r.file);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/strip'); xhr.responseType = 'blob';
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = e.loaded / e.total;
      r.bar.style.width = p * 100 + '%';
      if (p < 1) r.sub.textContent = `Uploading · ${Math.round(p * 100)}%`;
      else { r.sub.textContent = 'Cleaning…'; r.track.classList.add('busy'); }
    };
    const fail = (msg) => { r.track.remove(); r.sub.textContent = msg; r.sub.classList.add('err'); resolve(); };
    xhr.onerror = () => fail('Network error');
    xhr.onload = async () => {
      if (xhr.status !== 200) {
        let msg = 'Something went wrong';
        try { msg = JSON.parse(await xhr.response.text()).error || msg; } catch {}
        return fail(msg);
      }
      r.track.remove();
      const disp = xhr.getResponseHeader('Content-Disposition') || '';
      const fname = (disp.match(/filename="([^"]+)"/) || [])[1] || r.file.name;
      let rep = null;
      try { rep = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(xhr.getResponseHeader('X-Strip-Report')), (c) => c.charCodeAt(0)))); } catch {}
      const found = rep ? rep.before.found.length + Object.keys(rep.before.tags || {}).length : 0;
      const what = rep && rep.before.found.length ? rep.before.found.join(', ') : '';
      const detail = found ? `Removed ${what || found + ' tags'}` : 'Nothing found';
      r.sub.replaceChildren(h('b', null, 'Clean'), ` · ${detail}`);
      r.sub.title = detail;
      const a = h('a', 'btn', ICON_DL);
      a.href = URL.createObjectURL(xhr.response); a.download = fname; a.title = 'Download ' + fname;
      r.li.append(a);
      done.push(a);
      allBtn.style.display = done.length > 1 ? 'block' : 'none';
      resolve();
    };
    xhr.send(fd);
  });
}
</script>
</body>
</html>
