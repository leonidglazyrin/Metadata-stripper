<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strip</title>
<style>
  :root {
    --bg: #fafaf9; --card: #ffffff; --ink: #18181b; --soft: #71717a; --faint: #a1a1aa;
    --line: #ececea; --accent: #18181b; --accent-ink: #fafaf9; --ok: #16a34a; --bad: #dc2626;
    --hover: #f4f4f3; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d; --card: #151517; --ink: #f4f4f5; --soft: #a1a1aa; --faint: #63636b;
      --line: #232326; --accent: #f4f4f5; --accent-ink: #0c0c0d; --ok: #4ade80; --bad: #f87171;
      --hover: #1c1c1f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    padding: 12vh 16px 48px;
  }
  main { width: 100%; max-width: 520px; }

  header { text-align: center; margin-bottom: 28px; }

  .tabs {
    display: flex; gap: 4px; padding: 4px; margin: 0 auto 20px; width: fit-content;
    border-radius: 999px; background: var(--card); border: 1px solid var(--line);
  }
  .tabs button {
    border: 0; background: none; color: var(--soft); cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 550; padding: 7px 16px; border-radius: 999px;
    transition: background .15s, color .15s;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected=true] { background: var(--accent); color: var(--accent-ink); }
  .tabs button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  [role=tabpanel][hidden] { display: none; }

  .paste {
    display: flex; gap: 8px; align-items: flex-start; padding: 8px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  #fields { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .field { position: relative; animation: in .2s ease both; }
  .field input {
    width: 100%; height: 42px; padding: 0 38px 0 14px; display: block;
    border: 1px solid transparent; border-radius: 12px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: 15px;
    text-overflow: ellipsis;
  }
  .field input::placeholder { color: var(--faint); }
  .field input:focus { outline: none; border-color: var(--ink); }
  .field.proposed input:not(:focus) { background: transparent; border: 1px dashed var(--line); }
  .field .rm {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: 0; border-radius: 8px; cursor: pointer;
    background: none; color: var(--faint); display: grid; place-items: center;
  }
  .field .rm:hover { color: var(--ink); background: var(--hover); }
  .field.proposed .rm, .field:only-child .rm { display: none; }
  .go {
    flex: none; height: 42px; white-space: nowrap;
    border: 0; cursor: pointer; padding: 0 18px; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 14px; font-weight: 550;
  }
  .go:hover { opacity: .85; }
  .go:disabled { opacity: .4; cursor: default; }
  h1 { font-size: 30px; font-weight: 650; letter-spacing: -0.025em; }
  header p { color: var(--soft); margin-top: 6px; }

  #drop {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 44px 24px; border-radius: 20px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
  }
  #drop:hover { background: var(--hover); }
  #drop.over { transform: scale(1.015); border-color: var(--ink); }
  #drop:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .plus {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
  }
  #drop strong { font-weight: 550; }
  #drop small { color: var(--faint); font-size: 13px; margin-top: -10px; }

  .list { list-style: none; padding: 0; margin-top: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 10px 10px 10px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
    animation: in .25s ease both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .thumb {
    width: 44px; height: 44px; border-radius: 10px; flex: none; overflow: hidden;
    background: var(--hover); display: grid; place-items: center; color: var(--faint);
  }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 550; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub b { color: var(--ok); font-weight: 550; }
  .sub.err { color: var(--bad); }
  .track { height: 3px; border-radius: 3px; background: var(--line); margin-top: 7px; overflow: hidden; }
  .track > i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  .track.busy > i { width: 35% !important; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

  .btn {
    flex: none; border: 0; cursor: pointer; text-decoration: none;
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }

  .actions { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
  .all {
    display: none; padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 550; cursor: pointer;
  }
  .all:hover { background: var(--hover); }
  .all.clear { color: var(--soft); }

  .gear {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--soft);
    display: grid; place-items: center; transition: color .15s, background .15s;
  }
  .gear:hover, .gear[aria-expanded=true] { color: var(--ink); background: var(--hover); }
  .gear:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #settings {
    position: fixed; top: 62px; right: 16px; z-index: 10; width: min(300px, calc(100vw - 32px));
    padding: 14px 16px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    animation: in .15s ease both;
  }
  #settings h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 10px; }
  .setting { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .setting span { flex: 1; font-size: 14px; font-weight: 550; }
  .setting small { display: block; font-weight: 400; font-size: 12.5px; color: var(--soft); margin-top: 2px; }
  .switch { appearance: none; flex: none; width: 36px; height: 22px; margin-top: 1px; border-radius: 999px;
    background: var(--line); position: relative; cursor: pointer; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(14px); background: var(--accent-ink); }
  .switch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  footer { margin-top: auto; padding-top: 56px; color: var(--faint); font-size: 12.5px; text-align: center; max-width: 420px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<button id="gear" class="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<div id="settings" role="dialog" aria-label="Settings" hidden>
  <h2>Settings</h2>
  <label class="setting">
    <span>Multiple TikTok links<small>After you enter a link, an empty field appears for the next one.</small></span>
    <input id="opt-multi" class="switch" type="checkbox" role="switch">
  </label>
  <label class="setting">
    <span>Strip SynthID watermarks<small>Disrupts invisible AI watermarks. Slightly lossy — videos are re-encoded.</small></span>
    <input id="synthid" class="switch" type="checkbox" role="switch" checked>
  </label>
</div>

<main>
  <header>
    <h1>Strip</h1>
    <p>Remove every trace of metadata from your photos &amp; videos.</p>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-strip" aria-controls="panel-strip" aria-selected="true">Strip files</button>
    <button type="button" role="tab" id="tab-tiktok" aria-controls="panel-tiktok" aria-selected="false" tabindex="-1">TikTok</button>
  </div>

  <section id="panel-strip" role="tabpanel" aria-labelledby="tab-strip">
  <label id="drop" tabindex="0">
    <input id="input" type="file" multiple accept="image/*,video/*,.heic,.heif,.mkv,.mts,.m2ts" hidden>
    <span class="plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <strong>Drop files or click to upload</strong>
    <small>Photos and videos · EXIF, GPS, XMP, C2PA and more</small>
  </label>

  <ul id="list" class="list"></ul>
  <div class="actions">
    <button id="all" class="all" type="button">Download all</button>
    <button id="clear" class="all clear" type="button">Clear all</button>
  </div>
  </section>

  <section id="panel-tiktok" role="tabpanel" aria-labelledby="tab-tiktok" hidden>
  <form class="paste" id="tt-form" autocomplete="off">
    <div id="fields"></div>
    <button id="fetch" class="go" type="submit">Download</button>
  </form>

  <ul id="tt-list" class="list"></ul>
  <div class="actions">
    <button id="tt-all" class="all" type="button">Download all</button>
    <button id="tt-clear" class="all clear" type="button">Clear all</button>
  </div>
  </section>

</main>

<footer>Files are processed and deleted immediately. Nothing is stored.<br>Only download TikToks you have the right to save.</footer>

<script>
const $ = (s) => document.querySelector(s);
const drop = $('#drop'), input = $('#input'), list = $('#list'), allBtn = $('#all');
const done = [];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// Per-panel results: download-all / clear-all buttons and in-flight requests.
function makePanel(listEl, allEl, clearEl, doneArr, queueArr) {
  const p = { list: listEl, done: doneArr, queue: queueArr, active: new Set() };
  p.refresh = () => {
    allEl.style.display = p.done.length > 1 ? 'block' : 'none';
    clearEl.style.display = p.list.children.length ? 'block' : 'none';
  };
  p.clear = () => {
    p.queue.length = 0;
    for (const r of p.active) if (r.xhr) r.xhr.abort();
    p.active.clear();
    p.list.querySelectorAll('a[href^="blob:"], img[src^="blob:"], video[src^="blob:"]').forEach((el) => {
      URL.revokeObjectURL((el.href || el.src).split('#')[0]);
    });
    p.done.length = 0;
    p.list.replaceChildren();
    p.refresh();
  };
  allEl.addEventListener('click', () => p.done.forEach((a, i) => setTimeout(() => a.click(), i * 250)));
  clearEl.addEventListener('click', p.clear);
  return p;
}

// Tabs
const tabs = [...document.querySelectorAll('[role=tab]')];
function selectTab(t, focus) {
  tabs.forEach((b) => {
    const on = b === t;
    b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1;
    document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
  });
  if (focus) t.focus();
  try { localStorage.setItem('tab', t.id); } catch {}
}
tabs.forEach((b, i) => {
  b.addEventListener('click', () => selectTab(b));
  b.addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (d) selectTab(tabs[(i + d + tabs.length) % tabs.length], true);
  });
});
try { const t = document.getElementById(localStorage.getItem('tab')); if (t && tabs.includes(t)) selectTab(t); } catch {}

const ICON_DL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg>';
const ICON_FILE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';

drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => add(e.dataTransfer.files));
input.addEventListener('change', () => { add(input.files); input.value = ''; });
const queue = []; let running = 0;
const stripPanel = makePanel(list, allBtn, $('#clear'), done, queue);
function add(files) { for (const f of files) queue.push(row(f)); stripPanel.refresh(); next(); }
function next() {
  while (running < 2 && queue.length) {
    const r = queue.shift(); running++; stripPanel.active.add(r);
    send(r).finally(() => { running--; stripPanel.active.delete(r); next(); });
  }
}

const size = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function row(file) {
  const li = h('li', 'item');
  const thumb = h('div', 'thumb', ICON_FILE);
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('image/')) {
    const img = new Image(); img.onload = () => thumb.replaceChildren(img); img.src = url;
  } else if (file.type.startsWith('video/')) {
    const v = document.createElement('video'); v.muted = true; v.preload = 'metadata';
    v.onloadeddata = () => thumb.replaceChildren(v); v.src = url + '#t=0.1';
  }
  const meta = h('div', 'meta');
  const name = h('div', 'name'); name.textContent = file.name;
  const sub = h('div', 'sub'); sub.textContent = 'Waiting…';
  const track = h('div', 'track', '<i></i>');
  meta.append(name, sub, track);
  li.append(thumb, meta);
  list.prepend(li);
  return { file, li, sub, track, bar: track.firstChild, panel: stripPanel };
}

function send(r) {
  return new Promise((resolve) => {
    const fd = new FormData();
    fd.append('synthid', synthid.checked ? 'true' : 'false');
    fd.append('file', r.file);
    const xhr = r.xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/strip'); xhr.responseType = 'blob';
    xhr.onabort = () => resolve();
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = e.loaded / e.total;
      r.bar.style.width = p * 100 + '%';
      if (p < 1) r.sub.textContent = `Uploading · ${Math.round(p * 100)}%`;
      else { r.sub.textContent = 'Cleaning…'; r.track.classList.add('busy'); }
    };
    const fail = (msg) => { r.track.remove(); r.sub.textContent = msg; r.sub.classList.add('err'); resolve(); };
    xhr.onerror = () => fail('Network error');
    xhr.onload = () => finish(r, xhr, r.file.name, fail).then(resolve);
    xhr.send(fd);
  });
}

async function finish(r, xhr, fallbackName, fail) {
  if (!r.li.isConnected) return;
  if (xhr.status !== 200) {
    let msg = '';
    let text = '';
    try { text = await xhr.response.text(); msg = JSON.parse(text).error || ''; } catch {}
    if (!msg) {
      const pre = (text.match(/<pre>([\s\S]*?)<\/pre>/i) || [])[1];
      msg = xhr.status === 404 ? 'Server is missing this feature — restart it with the latest code'
        : xhr.status === 413 ? 'File too large'
        : xhr.status === 502 || xhr.status === 504 ? `Server timed out or unreachable (HTTP ${xhr.status})`
        : `Server error (HTTP ${xhr.status})${pre ? ': ' + pre.trim() : ''}`;
    }
    return fail(msg);
  }
  r.track.remove();
  const disp = xhr.getResponseHeader('Content-Disposition') || '';
  const fname = (disp.match(/filename="([^"]+)"/) || [])[1] || fallbackName;
  if (r.name) r.name.textContent = fname;
  let rep = null;
  try { rep = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(xhr.getResponseHeader('X-Strip-Report')), (c) => c.charCodeAt(0)))); } catch {}
  if (rep) {
    const found = rep.before.found.length + Object.keys(rep.before.tags || {}).length;
    const what = rep.before.found.length ? rep.before.found.join(', ') : '';
    const detail = found ? `Removed ${what || found + ' tags'}` : 'Nothing found';
    r.sub.replaceChildren(h('b', null, 'Clean'), ` · ${detail}`);
    r.sub.title = detail;
  } else {
    r.sub.replaceChildren(h('b', null, 'Ready'), ` · ${size(xhr.response.size)}`);
  }
  const blobUrl = URL.createObjectURL(xhr.response);
  if (r.thumb && /\.(mp4|mov|m4v|webm|mkv)$/i.test(fname)) {
    const v = document.createElement('video'); v.muted = true; v.preload = 'metadata';
    v.onloadeddata = () => r.thumb.replaceChildren(v); v.src = blobUrl + '#t=0.1';
  }
  const a = h('a', 'btn', ICON_DL);
  a.href = blobUrl; a.download = fname; a.title = 'Download ' + fname;
  r.li.append(a);
  r.panel.done.push(a);
  r.panel.refresh();
}

// TikTok tab
const form = $('#tt-form'), fieldsEl = $('#fields'), fetchBtn = $('#fetch'), ttList = $('#tt-list');
const ttDone = [];
const ttQueue = []; let ttRunning = 0;
const ttPanel = makePanel(ttList, $('#tt-all'), $('#tt-clear'), ttDone, ttQueue);
const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>';
const ICON_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

const extractUrls = (text) => (text.match(/https?:\/\/[^\s"'<>]+/gi) || []).map((u) => u.replace(/[),.;]+$/, ''));
const looksLikeLink = (v) => /tiktok\.com|^https?:\/\/\S+\.\S+/i.test(v.trim());

// Settings: multiple link fields (on by default)
let multi = store.get('multiLinks', true);
const gear = $('#gear'), settings = $('#settings'), optMulti = $('#opt-multi');
optMulti.checked = multi;

// SynthID stripping (on by default)
const synthid = $('#synthid');
synthid.checked = store.get('synthid', true);
synthid.addEventListener('change', () => store.set('synthid', synthid.checked));
const toggleSettings = (open = settings.hidden) => { settings.hidden = !open; gear.setAttribute('aria-expanded', open); };
gear.addEventListener('click', (e) => { e.stopPropagation(); toggleSettings(); });
document.addEventListener('click', (e) => { if (!settings.hidden && !settings.contains(e.target)) toggleSettings(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !settings.hidden) { toggleSettings(false); gear.focus(); } });
optMulti.addEventListener('change', () => {
  multi = optMulti.checked; store.set('multiLinks', multi);
  if (!multi) {
    // Collapse to a single field, keeping whatever was typed.
    const vals = fieldInputs().map((i) => i.value.trim()).filter(Boolean);
    fieldsEl.replaceChildren(); addField(vals.join(' '));
  }
  syncFields();
});

const fieldInputs = () => [...fieldsEl.querySelectorAll('input')];

function addField(value = '', focus = false) {
  const wrap = h('div', 'field');
  const inp = document.createElement('input');
  inp.type = 'url'; inp.inputMode = 'url'; inp.spellcheck = false; inp.value = value;
  inp.setAttribute('aria-label', 'TikTok link');
  const rm = h('button', 'rm', ICON_X); rm.type = 'button'; rm.tabIndex = -1; rm.setAttribute('aria-label', 'Remove link');
  rm.addEventListener('click', () => { removeField(wrap); });
  inp.addEventListener('input', syncFields);
  inp.addEventListener('paste', (e) => {
    const urls = extractUrls(e.clipboardData.getData('text'));
    if (urls.length < 2) return;
    e.preventDefault();
    if (!multi) { inp.value = urls.join(' '); syncFields(); return; }
    inp.value = urls[0];
    let after = wrap;
    for (const u of urls.slice(1)) { const w = addField(u); after.after(w); after = w; }
    syncFields();
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !inp.value && fieldInputs().length > 1) {
      e.preventDefault();
      const prev = wrap.previousElementSibling || wrap.nextElementSibling;
      removeField(wrap);
      prev && prev.querySelector('input').focus();
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const sib = e.key === 'ArrowDown' ? wrap.nextElementSibling : wrap.previousElementSibling;
      if (sib) { e.preventDefault(); sib.querySelector('input').focus(); }
    }
  });
  inp.addEventListener('blur', () => setTimeout(() => {
    // Drop emptied fields that aren't the trailing proposal.
    if (!inp.value.trim() && wrap.nextElementSibling && !wrap.contains(document.activeElement)) removeField(wrap);
  }, 120));
  wrap.append(inp, rm);
  fieldsEl.append(wrap);
  if (focus) inp.focus();
  return wrap;
}

function removeField(wrap) {
  if (fieldInputs().length > 1) wrap.remove(); else wrap.querySelector('input').value = '';
  syncFields();
}

function syncFields() {
  if (!fieldsEl.children.length) addField();
  if (multi) {
    // Always offer one empty field after the last filled one.
    const last = fieldsEl.lastElementChild.querySelector('input');
    if (looksLikeLink(last.value)) addField();
    // Never keep two empty fields at the end.
    while (fieldsEl.children.length > 1) {
      const [a, b] = [...fieldsEl.children].slice(-2).map((w) => w.querySelector('input'));
      if (a.value.trim() || b.value.trim()) break;
      (document.activeElement === b ? a : b).closest('.field').remove();
    }
  }
  const inputs = fieldInputs();
  inputs.forEach((inp, i) => {
    const proposed = multi && i > 0 && i === inputs.length - 1 && !inp.value.trim();
    inp.closest('.field').classList.toggle('proposed', proposed);
    inp.placeholder = i === 0 ? 'Paste a TikTok link' : 'Add another link';
  });
  const n = new Set(extractUrls(inputs.map((i) => i.value).join(' '))).size;
  fetchBtn.textContent = n > 1 ? `Download ${n}` : 'Download';
}

form.addEventListener('submit', (e) => { e.preventDefault(); startTikTok(); });
form.noValidate = true;

function startTikTok() {
  const inputs = fieldInputs();
  const urls = [...new Set(extractUrls(inputs.map((i) => i.value).join(' ')))];
  if (!urls.length) { inputs[0].focus(); return; }
  for (const url of urls) ttQueue.push(ttRow(url));
  ttPanel.refresh();
  fieldsEl.replaceChildren(); addField('', true); syncFields();
  ttNext();
}
syncFields();

function ttNext() {
  while (ttRunning < 2 && ttQueue.length) {
    const r = ttQueue.shift(); ttRunning++; ttPanel.active.add(r);
    ttSend(r).finally(() => { ttRunning--; ttPanel.active.delete(r); ttNext(); });
  }
}

function ttRow(url) {
  const li = h('li', 'item');
  const thumb = h('div', 'thumb', ICON_PLAY);
  const meta = h('div', 'meta');
  const name = h('div', 'name'); name.textContent = url.replace(/^https?:\/\/(www\.)?/, ''); name.title = url;
  const sub = h('div', 'sub'); sub.textContent = 'Waiting…';
  const track = h('div', 'track', '<i></i>');
  meta.append(name, sub, track);
  li.append(thumb, meta);
  ttList.prepend(li);
  return { url, li, thumb, name, sub, track, panel: ttPanel };
}

function ttSend(r) {
  return new Promise((resolve) => {
    r.sub.textContent = 'Downloading…'; r.track.classList.add('busy');
    const xhr = r.xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/tiktok'); xhr.responseType = 'blob';
    xhr.onabort = () => resolve();
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onprogress = (e) => {
      if (!e.lengthComputable) return;
      r.track.classList.remove('busy'); r.bar.style.width = (e.loaded / e.total) * 100 + '%';
      r.sub.textContent = `Receiving · ${Math.round((e.loaded / e.total) * 100)}%`;
    };
    r.bar = r.track.firstChild;
    const fail = (msg) => { r.track.remove(); r.sub.textContent = msg; r.sub.title = msg; r.sub.classList.add('err'); resolve(); };
    xhr.onerror = () => fail('Network error');
    xhr.onload = () => finish(r, xhr, 'tiktok.mp4', fail).then(resolve);
    xhr.send(JSON.stringify({ url: r.url }));
  });
}
</script>
</body>
